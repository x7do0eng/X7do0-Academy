<div class="course-shell">
    {{courseSidebar}}
    <main class="course-main">
        <header class="course-header">
            <div class="course-header__icon"><i class="fas fa-book-open" aria-hidden="true"></i></div>
            <div>
                <h1>دروس بايثون</h1>
                <p>شرح تفصيلي مع أمثلة وملفات الموضوع والتحدي.</p>
            </div>
        </header>

        <section id="lessons" class="lesson-workspace" aria-label="دروس أساسيات بايثون">
            <aside class="lesson-index">
                <div class="lesson-index__header">
                    <h2>الدروس</h2>
                    <span>12 درساً</span>
                </div>
                <nav id="lesson-list" aria-label="قائمة الدروس"></nav>
            </aside>
            <article id="lesson-viewer" class="lesson-viewer" aria-live="polite"></article>
        </section>
    </main>
</div>
