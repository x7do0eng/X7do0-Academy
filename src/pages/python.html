<div class="course-shell">
    {{courseSidebar}}
    <main class="course-main">
        <header id="course-overview" class="course-header">
            <div class="course-header__icon"><i class="fab fa-python" aria-hidden="true"></i></div>
            <div>
                <h1>نظرة عامة على بايثون</h1>
                <p>المفاهيم الأساسية للدورة في بطاقات تفاعلية مختصرة.</p>
            </div>
        </header>

        <section class="concept-overview" aria-labelledby="concept-overview-title">
            <div class="course-topics__heading">
                <div>
                    <h2 id="concept-overview-title">المواضيع البرمجية</h2>
                </div>
                <p>مرّر المؤشر فوق أي نقطة، أو اضغط عليها في الهاتف، لمشاهدة مثالها البرمجي.</p>
            </div>
            <div id="lesson-grid" class="concept-card-grid"></div>
        </section>
    </main>
</div>

<aside id="code-preview-popover" class="code-preview-popover" aria-live="polite" aria-hidden="true">
    <div id="code-preview-content"></div>
</aside>
